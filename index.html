<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Первый файл — ИИ-агент</title>
  <style>
    :root{--bg1:#0b1020;--bg2:#0f1724;--accent:#7ee787}
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;
      background: linear-gradient(135deg, #0f0f1a 0%, #0b1220 40%, #081221 100%);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color: #fff;
      overflow:hidden;
    }
    .wrap{
      text-align:center;max-width:90%;padding:40px;border-radius:12px;
    }
    h1{
      font-size:clamp(1.4rem, 4vw, 3.6rem);
      line-height:1.05;margin:0 0 24px;
      font-weight:700;
      opacity:0; transform:translateY(12px) scale(0.995);
      animation:fadeInUp 1s ease forwards 0.3s;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(142, 255, 180, 0.08), 0 0 7px rgba(142,255,180,0.18);
      color:linear-gradient(90deg,#fff,#c8ffd4);
    }
    @keyframes fadeInUp{
      to{opacity:1; transform:translateY(0) scale(1)}
    }
    /* subtle shining animation */
    h1::after{
      content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    }

    .btn{
      --bg: rgba(255,255,255,0.06);
      border:0; padding:12px 20px; color:#e8fff0; cursor:pointer; border-radius:10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(2,8,15,0.6), 0 0 18px rgba(126,231,135,0.04) inset;
      font-size:1rem; transition:transform .18s ease, box-shadow .18s ease;
    }
    .btn:active{transform:translateY(1px) scale(.995)}
    .btn:focus{outline:2px solid rgba(126,231,135,0.18)}

    .controls{display:flex;gap:12px;align-items:center;justify-content:center}

    /* center container layering */
    .stage{position:relative;z-index:1}

    /* canvas full-screen for confetti */
    canvas.confetti-canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999}

    /* small responsive adjustments */
    @media (min-width:900px){
      h1{font-size:clamp(2rem, 3.5vw, 4rem)}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="wrap">
      <h1>Привет! Это мой первый файл, который собрал ИИ-агент</h1>
      <div class="controls" style="margin-top:20px;">
        <button id="confettiBtn" class="btn" aria-label="Нажми меня">Нажми меня</button>
      </div>
    </div>
  </div>

  <!-- canvas-confetti from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script>
    // Create a full-screen canvas for confetti (canvas-confetti will also create its own if not provided,
    // but we ensure pointer-events:none and sizing here).
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    canvas.width = innerWidth; canvas.height = innerHeight;
    document.body.appendChild(canvas);

    // configure confetti to use our canvas
    const myConfetti = confetti.create(canvas, {
      resize: true, // will fit the canvas to window
      useWorker: true
    });

    const btn = document.getElementById('confettiBtn');
    btn.addEventListener('click', () => {
      // small accessibility feedback: briefly scale the button
      btn.style.transform = 'scale(0.98)';
      setTimeout(()=>btn.style.transform='',140);

      // burst sequence
      myConfetti({
        particleCount: 40,
        spread: 80,
        origin: { x: 0.5, y: 0.3 },
        colors: ['#7EE787','#7ED8FF','#FFD97E','#FF7EC8','#D6A8FF']
      });
      setTimeout(()=>{
        myConfetti({ particleCount: 30, spread: 120, origin: { x: Math.random(), y: 0.2 } });
      }, 250);
      setTimeout(()=>{
        myConfetti({ particleCount: 20, spread: 160, origin: { x: Math.random(), y: 0.3 } });
      }, 500);
    });

    // graceful intro animation for accessibility - reduce motion respect
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(prefersReduced){
      document.querySelector('h1').style.animation = 'none';
      document.querySelector('h1').style.opacity = '1';
      document.querySelector('h1').style.transform = 'none';
    }
  </script>
</body>
</html>
